apiVersion: apps/v1
kind: Deployment
metadata:
  name: templates
  namespace: templates
spec:
  replicas: 1
  selector:
    matchLabels:
      ocf.berkeley.edu/flux: templates
  template:
    metadata:
      labels:
        ocf.berkeley.edu/flux: templates
    spec:
      containers:
      - image: ghcr.io/ocf/templates:4ea4e236d7ca58cc75fb62a486566a26aab6517f
        imagePullPolicy: IfNotPresent
        name: main
        ports:
        - containerPort: 3000